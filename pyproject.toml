[project]
name = "doctalkai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dev Goyal", email = "devgoyalg2346@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.32",
    "langchain>=1.4.9",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
]

[project.scripts]
doctalkai = "doctalkai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
